version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: bardan_erp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bardan
      POSTGRES_PASSWORD: bardan_pass
      POSTGRES_DB: bardan_erp
    ports:
      - "5432:5432"
    volumes:
      - bardan_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bardan -d bardan_erp"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    container_name: bardan_erp_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  bardan_pgdata:
